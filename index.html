<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>100 Java Games Vault | Retro J2ME Mobile Arcade</title>
  <meta name="description" content="100 Classic Java mobile games in one retro arcade vault. Play Space Impact, Nokia Snake II, Bounce, and explore 100 legendary J2ME titles.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent: #ff007f;
      --gold: #f9d423;
      --bg: #070913;
      --panel: #0d1224;
      --panel-border: rgba(0, 242, 254, 0.22);
      --card-bg: rgba(15, 22, 41, 0.75);
      --screen-bg: #040810;
      --text: #e2e8f0;
      --text-dim: #7e8da9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(79, 172, 254, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(255, 0, 127, 0.1) 0%, transparent 40%);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0.75rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.25rem;
      max-width: 900px;
    }

    .retro-badge {
      display: inline-block;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      padding: 0.35rem 0.85rem;
      border-radius: 4px;
      margin-bottom: 0.6rem;
      letter-spacing: 1px;
      box-shadow: 0 0 14px rgba(249, 115, 22, 0.5);
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.45rem;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.8), 0 0 25px rgba(79, 172, 254, 0.4);
      margin-bottom: 0.4rem;
      line-height: 1.4;
    }

    .sub-title {
      font-size: 1.1rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    /* Emulator Container */
    .arcade-chassis {
      background: linear-gradient(180deg, #151d33 0%, #0d1222 100%);
      border: 2px solid rgba(0, 242, 254, 0.4);
      border-radius: 24px;
      padding: 1.25rem;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.8),
        0 0 25px rgba(0, 242, 254, 0.15),
        inset 0 1px 2px rgba(255, 255, 255, 0.15);
      width: 100%;
      max-width: 490px;
      position: relative;
      margin-bottom: 2.5rem;
    }

    .top-phone-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem 0.75rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      color: #64748b;
    }

    .speaker-grill {
      width: 60px;
      height: 4px;
      background: #25334d;
      border-radius: 2px;
    }

    /* Screen Bezel */
    .screen-bezel {
      background: #020409;
      border: 3px solid #1e293b;
      border-radius: 12px;
      padding: 6px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
    }

    .screen-bezel::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.75;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 280px;
      background: var(--screen-bg);
      border-radius: 6px;
      image-rendering: pixelated;
    }

    .game-hud {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0.25rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      color: var(--primary);
      text-shadow: 0 0 5px var(--primary);
    }

    /* Controls */
    .controls-panel {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .keypad-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem;
    }

    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 4px;
    }

    .dpad-btn {
      background: #1e2942;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 3px 0 #0f172a;
    }

    .dpad-btn:active {
      background: var(--primary);
      color: #000;
      transform: translateY(2px);
    }

    .dpad-center {
      background: #111827;
      border-radius: 50%;
      border: 1px solid #1f293d;
    }

    .action-group {
      display: flex;
      gap: 0.75rem;
    }

    .action-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(255, 0, 127, 0.4);
      background: radial-gradient(circle at 35% 35%, #ff2a85, #b8004f);
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #70002e, 0 0 12px rgba(255, 0, 127, 0.4);
      touch-action: manipulation;
    }

    .action-btn.btn-b {
      background: radial-gradient(circle at 35% 35%, #00f2fe, #0088cc);
      border-color: rgba(0, 242, 254, 0.4);
      box-shadow: 0 4px 0 #005580, 0 0 12px rgba(0, 242, 254, 0.4);
    }

    .action-btn:active {
      transform: translateY(3px);
    }

    .system-buttons {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    .sys-btn {
      background: #162036;
      border: 1px solid #293856;
      color: #94a3b8;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 0 #0b1120;
    }

    /* 100 Games Catalog Section */
    .vault-section {
      width: 100%;
      max-width: 1100px;
      margin-top: 1rem;
    }

    .vault-header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 1.25rem;
    }

    .vault-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .vault-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.95rem;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-box {
      width: 100%;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: #060914;
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .category-pills {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .cat-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.3rem 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-pill.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
    }

    /* 100 Game Cards Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      transition: transform 0.15s, border-color 0.15s;
    }

    .game-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .game-card-top {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .game-icon {
      font-size: 1.75rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.4rem;
      border-radius: 8px;
      line-height: 1;
    }

    .game-meta {
      flex: 1;
    }

    .game-id {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: var(--gold);
    }

    .game-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      margin: 0.15rem 0;
    }

    .game-dev {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .game-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.35;
      margin-bottom: 0.75rem;
      flex-grow: 1;
    }

    .game-card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 0.5rem;
    }

    .game-genre-tag {
      font-size: 0.75rem;
      background: rgba(0, 242, 254, 0.12);
      color: var(--primary);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .play-card-btn {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      border: none;
      color: #000;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      transition: opacity 0.15s;
    }

    .play-card-btn:hover {
      opacity: 0.9;
    }

    .play-card-btn.sim-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="retro-badge">100-IN-1 VAULT • JAVA 17 • J2ME RETRO</div>
    <h1>100 JAVA GAMES</h1>
    <p class="sub-title">100 Legendary Nokia & Mobile Phone Classics in One Web Arcade</p>
  </header>

  <!-- Retro Phone Arcade Device -->
  <div class="arcade-chassis">
    <div class="top-phone-bar">
      <span id="active-game-title">SPACE IMPACT</span>
      <div class="speaker-grill"></div>
      <span id="sound-indicator" style="cursor: pointer;" onclick="toggleSound()">🔊 ON</span>
    </div>

    <!-- Screen Bezel -->
    <div class="screen-bezel">
      <div class="game-hud">
        <span id="hud-score">SCORE: 0</span>
        <span id="hud-level">LVL: 1</span>
        <span id="hud-lives">♥♥♥</span>
      </div>
      <canvas id="gameCanvas" width="360" height="260"></canvas>
    </div>

    <!-- Controls -->
    <div class="controls-panel">
      <div class="keypad-row">
        <!-- D-PAD -->
        <div class="dpad-container">
          <div></div>
          <button class="dpad-btn" id="dpad-up" onpointerdown="handleInput('ArrowUp', true)" onpointerup="handleInput('ArrowUp', false)">▲</button>
          <div></div>
          <button class="dpad-btn" id="dpad-left" onpointerdown="handleInput('ArrowLeft', true)" onpointerup="handleInput('ArrowLeft', false)">◀</button>
          <div class="dpad-btn dpad-center"></div>
          <button class="dpad-btn" id="dpad-right" onpointerdown="handleInput('ArrowRight', true)" onpointerup="handleInput('ArrowRight', false)">▶</button>
          <div></div>
          <button class="dpad-btn" id="dpad-down" onpointerdown="handleInput('ArrowDown', true)" onpointerup="handleInput('ArrowDown', false)">▼</button>
          <div></div>
        </div>

        <!-- Action buttons -->
        <div class="action-group">
          <button class="action-btn btn-b" id="btn-action-b" onpointerdown="handleInput('KeyX', true)" onpointerup="handleInput('KeyX', false)">B</button>
          <button class="action-btn" id="btn-action-a" onpointerdown="handleInput('Space', true)" onpointerup="handleInput('Space', false)">A</button>
        </div>
      </div>

      <div class="system-buttons">
        <button class="sys-btn" onclick="togglePause()">PAUSE [P]</button>
        <button class="sys-btn" onclick="restartCurrentGame()">RESTART</button>
        <button class="sys-btn" onclick="toggleSound()">AUDIO</button>
      </div>
    </div>
  </div>

  <!-- 100 Games Catalog -->
  <section class="vault-section">
    <div class="vault-header">
      <div class="vault-title-row">
        <div class="vault-title">
          <span>🕹️</span>
          <span>100-IN-1 GAME VAULT</span>
        </div>
        <span id="game-count-label" style="font-size: 0.9rem; color: var(--gold); font-weight: 700;">Showing 100 Games</span>
      </div>

      <div class="search-box">
        <input type="text" id="game-search" class="search-input" placeholder="🔍 Search by name, developer (e.g. Asphalt, Gameloft, Nokia, Doom, Snake)..." oninput="filterGames()">
      </div>

      <div class="category-pills">
        <button class="cat-pill active" onclick="setCategory('all')">All (100)</button>
        <button class="cat-pill" onclick="setCategory('Action')">Action (20)</button>
        <button class="cat-pill" onclick="setCategory('Arcade')">Arcade (20)</button>
        <button class="cat-pill" onclick="setCategory('Racing')">Racing (15)</button>
        <button class="cat-pill" onclick="setCategory('Puzzle')">Puzzle (20)</button>
        <button class="cat-pill" onclick="setCategory('Sports')">Sports (13)</button>
        <button class="cat-pill" onclick="setCategory('RPG')">RPG & Strategy (12)</button>
      </div>
    </div>

    <!-- 100 Game Cards -->
    <div id="games-grid" class="games-grid">
      <!-- Injected by JavaScript -->
    </div>
  </section>

  <footer>
    <p>100 Java Games Archive • Powered by Java 17 & Vercel Edge • <a href="https://github.com/saschool12/java" target="_blank">github.com/saschool12/java</a></p>
  </footer>

  <script>
    // -------------------------------------------------------------
    // 8-BIT AUDIO SYNTHESIZER
    // -------------------------------------------------------------
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq, type = 'square', duration = 0.08, volume = 0.12) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playLaserSound() {
      if (!soundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    function playExplosionSound() {
      if (!soundEnabled) return;
      playBeep(90, 'sawtooth', 0.25, 0.2);
    }

    function playPowerupSound() {
      if (!soundEnabled) return;
      [320, 480, 640, 960].forEach((freq, idx) => {
        setTimeout(() => playBeep(freq, 'triangle', 0.06, 0.12), idx * 45);
      });
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-indicator').innerText = soundEnabled ? '🔊 ON' : '🔇 OFF';
      if (soundEnabled) playBeep(440);
    }

    // -------------------------------------------------------------
    // ARCADE GAME ENGINES (Space Impact, Snake II, Bounce, Asteroids, Racer, Flappy)
    // -------------------------------------------------------------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let currentGame = 'space-impact';
    let isPaused = false;
    let score = 0;
    let lives = 3;
    let level = 1;
    let gameOver = false;

    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false,
      Space: false,
      KeyX: false
    };

    function handleInput(code, isDown) {
      if (isDown) initAudio();
      if (keys.hasOwnProperty(code)) keys[code] = isDown;
      if (isDown && (code === 'Space' || code === 'KeyX') && gameOver) {
        restartCurrentGame();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyP') { togglePause(); return; }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyX'].includes(e.code)) {
        e.preventDefault();
        handleInput(e.code, true);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyX'].includes(e.code)) {
        e.preventDefault();
        handleInput(e.code, false);
      }
    });

    // Space Impact Engine
    const spaceImpact = {
      player: { x: 30, y: 120, w: 24, h: 14, speed: 3.5, cooldown: 0 },
      bullets: [], enemies: [], particles: [], stars: [], spawnTimer: 0,
      init() {
        this.player.x = 30; this.player.y = canvas.height / 2 - 7;
        this.bullets = []; this.enemies = []; this.particles = []; this.stars = [];
        for (let i = 0; i < 35; i++) {
          this.stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: 0.5 + Math.random() * 2 });
        }
      },
      update() {
        if (gameOver || isPaused) return;
        if (keys.ArrowUp && this.player.y > 5) this.player.y -= this.player.speed;
        if (keys.ArrowDown && this.player.y < canvas.height - this.player.h - 5) this.player.y += this.player.speed;
        if (keys.ArrowLeft && this.player.x > 5) this.player.x -= this.player.speed;
        if (keys.ArrowRight && this.player.x < canvas.width / 2) this.player.x += this.player.speed;

        this.player.cooldown--;
        if ((keys.Space || keys.KeyX) && this.player.cooldown <= 0) {
          this.bullets.push({ x: this.player.x + this.player.w, y: this.player.y + 6, speed: 6.5, w: 8, h: 3 });
          this.player.cooldown = 12;
          playLaserSound();
        }

        this.stars.forEach(s => { s.x -= s.speed; if (s.x < 0) s.x = canvas.width; });

        for (let i = this.bullets.length - 1; i >= 0; i--) {
          this.bullets[i].x += this.bullets[i].speed;
          if (this.bullets[i].x > canvas.width) this.bullets.splice(i, 1);
        }

        this.spawnTimer++;
        if (this.spawnTimer > Math.max(25, 60 - level * 5)) {
          this.spawnTimer = 0;
          const isHeavy = Math.random() > 0.7;
          this.enemies.push({
            x: canvas.width + 10, y: 15 + Math.random() * (canvas.height - 40),
            w: isHeavy ? 24 : 16, h: isHeavy ? 20 : 12, hp: isHeavy ? 3 : 1,
            speed: isHeavy ? 1.5 : 2.5 + Math.random() * 1.5, isHeavy
          });
        }

        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const e = this.enemies[i];
          e.x -= e.speed;
          for (let j = this.bullets.length - 1; j >= 0; j--) {
            const b = this.bullets[j];
            if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
              this.bullets.splice(j, 1);
              e.hp--;
              if (e.hp <= 0) {
                playExplosionSound();
                score += e.isHeavy ? 150 : 50;
                if (score > level * 800) level++;
                this.enemies.splice(i, 1);
                updateHud();
                break;
              }
            }
          }
          if (this.enemies[i] && this.player.x < e.x + e.w && this.player.x + this.player.w > e.x &&
              this.player.y < e.y + e.h && this.player.y + this.player.h > e.y) {
            this.enemies.splice(i, 1);
            playExplosionSound();
            lives--;
            updateHud();
            if (lives <= 0) gameOver = true;
          }
          if (e.x < -30) this.enemies.splice(i, 1);
        }
      },
      draw() {
        ctx.fillStyle = '#050711';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#475569';
        this.stars.forEach(s => ctx.fillRect(s.x, s.y, 2, 2));

        // Player
        ctx.fillStyle = '#00f2fe';
        const p = this.player;
        ctx.fillRect(p.x, p.y + 4, p.w, 6);
        ctx.fillRect(p.x + 6, p.y, 10, 14);
        ctx.fillStyle = Math.random() > 0.5 ? '#f97316' : '#ef4444';
        ctx.fillRect(p.x - 5, p.y + 5, 5, 4);

        // Bullets
        ctx.fillStyle = '#f9d423';
        this.bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

        // Enemies
        this.enemies.forEach(e => {
          ctx.fillStyle = e.isHeavy ? '#ea580c' : '#ec4899';
          ctx.fillRect(e.x, e.y, e.w, e.h);
          ctx.fillStyle = '#fff';
          ctx.fillRect(e.x + 3, e.y + 3, 3, 3);
        });
      }
    };

    // Snake II Engine
    const snakeGame = {
      gridSize: 10, snake: [], dir: { x: 1, y: 0 }, nextDir: { x: 1, y: 0 }, food: { x: 15, y: 12 }, moveTimer: 0,
      init() {
        this.snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        this.dir = { x: 1, y: 0 }; this.nextDir = { x: 1, y: 0 };
        this.spawnFood();
      },
      spawnFood() {
        const cols = Math.floor(canvas.width / this.gridSize);
        const rows = Math.floor(canvas.height / this.gridSize);
        this.food = { x: Math.floor(Math.random() * (cols - 2)) + 1, y: Math.floor(Math.random() * (rows - 2)) + 1 };
      },
      update() {
        if (gameOver || isPaused) return;
        if (keys.ArrowUp && this.dir.y === 0) this.nextDir = { x: 0, y: -1 };
        if (keys.ArrowDown && this.dir.y === 0) this.nextDir = { x: 0, y: 1 };
        if (keys.ArrowLeft && this.dir.x === 0) this.nextDir = { x: -1, y: 0 };
        if (keys.ArrowRight && this.dir.x === 0) this.nextDir = { x: 1, y: 0 };

        this.moveTimer++;
        if (this.moveTimer < Math.max(4, 9 - level)) return;
        this.moveTimer = 0;

        this.dir = { ...this.nextDir };
        const head = { x: this.snake[0].x + this.dir.x, y: this.snake[0].y + this.dir.y };
        const cols = Math.floor(canvas.width / this.gridSize);
        const rows = Math.floor(canvas.height / this.gridSize);

        if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
          playExplosionSound(); lives--; updateHud();
          if (lives <= 0) gameOver = true; else this.init();
          return;
        }

        for (let i = 0; i < this.snake.length; i++) {
          if (head.x === this.snake[i].x && head.y === this.snake[i].y) {
            playExplosionSound(); lives--; updateHud();
            if (lives <= 0) gameOver = true; else this.init();
            return;
          }
        }

        this.snake.unshift(head);
        if (head.x === this.food.x && head.y === this.food.y) {
          score += 100 * level; playPowerupSound(); this.spawnFood();
          if (score >= level * 500) level++;
          updateHud();
        } else {
          this.snake.pop();
        }
      },
      draw() {
        ctx.fillStyle = '#879b6f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#1e2d14';
        this.snake.forEach(part => ctx.fillRect(part.x * this.gridSize + 1, part.y * this.gridSize + 1, this.gridSize - 2, this.gridSize - 2));
        ctx.fillStyle = '#14200d';
        ctx.fillRect(this.food.x * this.gridSize + 2, this.food.y * this.gridSize + 2, this.gridSize - 4, this.gridSize - 4);
      }
    };

    // Brick Breaker Engine
    const brickBreaker = {
      paddle: { x: 140, y: 240, w: 60, h: 8, speed: 5 },
      ball: { x: 180, y: 220, r: 4, vx: 3, vy: -3 },
      bricks: [],
      init() {
        this.paddle.x = canvas.width / 2 - 30;
        this.ball.x = canvas.width / 2; this.ball.y = canvas.height - 40;
        this.ball.vx = 2.5 * (Math.random() > 0.5 ? 1 : -1); this.ball.vy = -3;
        this.bricks = [];
        const colors = ['#ff007f', '#f97316', '#00f2fe', '#10b981'];
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 8; c++) {
            this.bricks.push({ x: 20 + c * 43, y: 25 + r * 18, w: 38, h: 12, color: colors[r], alive: true });
          }
        }
      },
      update() {
        if (gameOver || isPaused) return;
        if (keys.ArrowLeft && this.paddle.x > 5) this.paddle.x -= this.paddle.speed;
        if (keys.ArrowRight && this.paddle.x < canvas.width - this.paddle.w - 5) this.paddle.x += this.paddle.speed;

        this.ball.x += this.ball.vx; this.ball.y += this.ball.vy;
        if (this.ball.x - this.ball.r < 0 || this.ball.x + this.ball.r > canvas.width) { this.ball.vx = -this.ball.vx; playBeep(320); }
        if (this.ball.y - this.ball.r < 0) { this.ball.vy = -this.ball.vy; playBeep(350); }

        if (this.ball.y + this.ball.r >= this.paddle.y && this.ball.y - this.ball.r <= this.paddle.y + this.paddle.h &&
            this.ball.x >= this.paddle.x && this.ball.x <= this.paddle.x + this.paddle.w) {
          this.ball.vy = -Math.abs(this.ball.vy);
          const hit = (this.ball.x - (this.paddle.x + this.paddle.w / 2)) / (this.paddle.w / 2);
          this.ball.vx = hit * 4.5;
          playBeep(520, 'triangle');
        }

        let left = 0;
        this.bricks.forEach(b => {
          if (!b.alive) return;
          left++;
          if (this.ball.x > b.x && this.ball.x < b.x + b.w && this.ball.y > b.y && this.ball.y < b.y + b.h) {
            b.alive = false; this.ball.vy = -this.ball.vy; score += 120;
            playPowerupSound(); updateHud();
          }
        });

        if (left === 0) { level++; updateHud(); this.init(); }
        if (this.ball.y > canvas.height) {
          lives--; playExplosionSound(); updateHud();
          if (lives <= 0) gameOver = true;
          else { this.ball.x = this.paddle.x + 30; this.ball.y = this.paddle.y - 10; this.ball.vy = -3; }
        }
      },
      draw() {
        ctx.fillStyle = '#050711';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00f2fe';
        ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.w, this.paddle.h);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(this.ball.x, this.ball.y, this.ball.r, 0, Math.PI * 2); ctx.fill();
        this.bricks.forEach(b => { if (b.alive) { ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); } });
      }
    };

    // Pixel Racer Engine
    const pixelRacer = {
      carX: 180, obstacles: [], speed: 4, timer: 0,
      init() { this.carX = canvas.width / 2; this.obstacles = []; this.timer = 0; },
      update() {
        if (gameOver || isPaused) return;
        if (keys.ArrowLeft && this.carX > 60) this.carX -= 4.5;
        if (keys.ArrowRight && this.carX < canvas.width - 80) this.carX += 4.5;
        this.timer++;
        if (this.timer > 35) {
          this.timer = 0;
          this.obstacles.push({ x: 65 + Math.random() * (canvas.width - 150), y: -30, w: 22, h: 32, color: '#ff007f' });
        }
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
          const o = this.obstacles[i];
          o.y += this.speed + level * 0.5;
          if (o.x < this.carX + 20 && o.x + o.w > this.carX && o.y < 210 + 35 && o.y + o.h > 210) {
            playExplosionSound(); lives--; updateHud();
            this.obstacles.splice(i, 1);
            if (lives <= 0) gameOver = true;
          }
          if (o.y > canvas.height) { this.obstacles.splice(i, 1); score += 50; updateHud(); }
        }
      },
      draw() {
        ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f172a'; ctx.fillRect(50, 0, canvas.width - 100, canvas.height);
        ctx.fillStyle = '#f9d423';
        for (let y = 0; y < canvas.height; y += 40) ctx.fillRect(canvas.width / 2 - 2, (y + (Date.now() / 10) % 40), 4, 20);

        // Player Car
        ctx.fillStyle = '#00f2fe'; ctx.fillRect(this.carX, 210, 20, 32);
        ctx.fillStyle = '#fff'; ctx.fillRect(this.carX + 4, 215, 12, 8);
        this.obstacles.forEach(o => { ctx.fillStyle = o.color; ctx.fillRect(o.x, o.y, o.w, o.h); });
      }
    };

    function switchGame(slug, title) {
      currentGame = slug;
      document.getElementById('active-game-title').innerText = (title || slug).toUpperCase();
      restartCurrentGame();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function restartCurrentGame() {
      score = 0; lives = 3; level = 1; gameOver = false; isPaused = false;
      updateHud();
      if (currentGame === 'snake-retro') snakeGame.init();
      else if (currentGame === 'brick-breaker' || currentGame === 'bounce') brickBreaker.init();
      else if (currentGame === 'pixel-racer' || currentGame.includes('asphalt') || currentGame.includes('racing') || currentGame.includes('nfs')) pixelRacer.init();
      else spaceImpact.init();
    }

    function togglePause() {
      isPaused = !isPaused;
      playBeep(isPaused ? 250 : 500);
    }

    function updateHud() {
      document.getElementById('hud-score').innerText = `SCORE: ${score}`;
      document.getElementById('hud-level').innerText = `LVL: ${level}`;
      document.getElementById('hud-lives').innerText = '♥'.repeat(Math.max(0, lives));
    }

    function loop() {
      if (currentGame === 'snake-retro') { snakeGame.update(); snakeGame.draw(); }
      else if (currentGame === 'brick-breaker' || currentGame === 'bounce') { brickBreaker.update(); brickBreaker.draw(); }
      else if (currentGame === 'pixel-racer' || currentGame.includes('asphalt') || currentGame.includes('racing') || currentGame.includes('nfs')) { pixelRacer.update(); pixelRacer.draw(); }
      else { spaceImpact.update(); spaceImpact.draw(); }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0055'; ctx.font = '16px "Press Start 2P"'; ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#fff'; ctx.font = '10px "Press Start 2P"';
        ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
        ctx.fillText('PRESS [A] TO RESTART', canvas.width / 2, canvas.height / 2 + 35);
      } else if (isPaused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00f2fe'; ctx.font = '14px "Press Start 2P"'; ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      }
      requestAnimationFrame(loop);
    }

    // -------------------------------------------------------------
    // 100 GAMES DATA & FILTERING
    // -------------------------------------------------------------
    let allGames = [];
    let currentCategory = 'all';

    async function loadGames() {
      try {
        const res = await fetch('/api/games');
        if (res.ok) {
          allGames = await res.json();
          renderGamesGrid(allGames);
          return;
        }
      } catch (e) {}

      // Fallback local dataset for static Vercel Edge hosting
      allGames = generateLocal100Games();
      renderGamesGrid(allGames);
    }

    function renderGamesGrid(games) {
      const container = document.getElementById('games-grid');
      container.innerHTML = '';
      document.getElementById('game-count-label').innerText = `Showing ${games.length} of 100 Games`;

      games.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <div>
            <div class="game-card-top">
              <span class="game-icon">${g.icon}</span>
              <div class="game-meta">
                <span class="game-id">#${g.id}</span>
                <h3 class="game-title">${g.title}</h3>
                <div class="game-dev">${g.developer} • ${g.year}</div>
              </div>
            </div>
            <p class="game-desc">${g.description}</p>
          </div>
          <div class="game-card-bottom">
            <span class="game-genre-tag">${g.category}</span>
            <button class="play-card-btn ${g.playable ? '' : 'sim-btn'}" onclick="switchGame('${g.slug}', '${g.title}')">
              ${g.playable ? '▶ PLAY' : '🎮 SIMULATE'}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase().includes(cat.toLowerCase()));
      });
      filterGames();
    }

    function filterGames() {
      const query = document.getElementById('game-search').value.toLowerCase().trim();
      const filtered = allGames.filter(g => {
        const matchCat = currentCategory === 'all' || g.category.toLowerCase().includes(currentCategory.toLowerCase());
        const matchQuery = !query || 
          g.title.toLowerCase().includes(query) || 
          g.developer.toLowerCase().includes(query) ||
          g.category.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });
      renderGamesGrid(filtered);
    }
